<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Portfolio</title>
  <meta name="description" content="영상 포트폴리오">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 유리 광학 파이프라인. 헤더의 backdrop-filter 가 참조한다.
       화면에는 보이지 않고 공간도 차지하지 않는다.
       display:none 으로 숨기면 filter 참조 자체가 해석되지 않으므로 .svg-defs 로 처리. -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <filter id="glass-3d" x="-20%" y="-20%" width="140%" height="140%"
            color-interpolation-filters="sRGB">
      <!-- 1. 렌즈 굴곡의 기준이 될 저주파 굴절맵 -->
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.04" numOctaves="2"
                    seed="11" result="warpmap"/>

      <!-- 2. 굴절맵의 R/G 를 좌표 변위로 읽어 뒤 픽셀을 물리적으로 휘게 한다 -->
      <feDisplacementMap in="SourceGraphic" in2="warpmap" scale="16"
                         xChannelSelector="R" yChannelSelector="G" result="warped"/>

      <!-- 3. 유리 두께에 의한 산란과 채도 상승 -->
      <feGaussianBlur in="warped" stdDeviation="4" result="scattered"/>
      <feColorMatrix in="scattered" type="saturate" values="1.8" result="body"/>

      <!-- 4. 표면 입자 — 블러가 만드는 계조 띠를 덮는다 -->
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3"
                    stitchTiles="stitch" result="g0"/>
      <feColorMatrix in="g0" type="saturate" values="0" result="g1"/>
      <feComponentTransfer in="g1" result="grain">
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feComposite in="grain" in2="body" operator="over" result="grained"/>

      <!-- 5. 가상 광원으로 표면 반사광.
           굴절맵을 그대로 쓰면 고주파 얼룩이 헤더 전면을 덮으므로(실측 표준편차 7.39),
           크게 뭉갠 표면에 약한 광원을 쏘아 넓은 윤기만 남긴다 (1.22). -->
      <feGaussianBlur in="warpmap" stdDeviation="9" result="smooth"/>
      <feSpecularLighting in="smooth" surfaceScale="2" specularConstant="0.22"
                          specularExponent="40" lighting-color="#ffffff" result="spec">
        <fePointLight x="700" y="-60" z="110"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="grained" operator="in" result="specClipped"/>
      <feComposite in="specClipped" in2="grained" operator="arithmetic"
                   k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </svg>

  <header class="header" id="header">
    <div class="container header__inner">
      <a class="header__logo" href="#top">PORTFOLIO</a>
      <nav class="nav">
        <a class="nav__link" href="#about">About</a>
        <a class="nav__link" href="#works">Works</a>
      </nav>
    </div>
  </header>

  <main id="top">

    <!-- Hero -->
    <section class="container hero">
      <h1 class="hero__title" data-reveal>
        Frame by frame<span class="accent">,</span>
        <em>story by story<span class="accent">.</span></em>
      </h1>
      <div class="signature" role="img" aria-label="정희성 서명">
        <video class="signature__video" src="assets/signature.mp4" autoplay muted playsinline></video>
      </div>
    </section>

    <!-- About -->
    <section class="section" id="about">
      <div class="container">
        <span class="section__label" data-reveal>About</span>
        <h2 class="section__title about__name" data-reveal>Jeong Heesung</h2>
        <p class="about__role" data-reveal>Director &amp; Editor</p>
        <a class="about__link" data-reveal href="https://instagram.com/tiifosia" target="_blank" rel="noopener">
          <svg class="about__icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5.4"/>
            <circle cx="12" cy="12" r="4.2"/>
            <circle class="about__icon-dot" cx="17.3" cy="6.7" r="1.15"/>
          </svg>
          @tiifosia
        </a>
      </div>
    </section>

    <!-- Works -->
    <section class="section" id="works">
      <div class="container">
        <div class="works__head">
          <span class="section__label" data-reveal>Works</span>
          <h2 class="section__title" data-reveal>Archive</h2>
        </div>

        <ul class="works__grid">
          <li class="work" data-reveal>
            <button class="work__trigger" type="button"
                    data-video-id="5j0lvHHFzhI"
                    aria-label="작품 제목 영상 재생">
              <figure class="work__thumb">
                <img src="https://img.youtube.com/vi/5j0lvHHFzhI/maxresdefault.jpg"
                     data-fallback="https://img.youtube.com/vi/5j0lvHHFzhI/hqdefault.jpg"
                     alt="" loading="lazy">
              </figure>
            </button>
            <h3 class="work__title">작품 제목</h3>
            <p class="work__meta">Work &middot; 2025</p>
          </li>
        </ul>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>&copy; 2026 Portfolio. All rights reserved.</span>
      <span>Seoul, Korea</span>
    </div>
  </footer>

  <div class="modal" id="modal">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-label="영상 재생">
      <button class="modal__close" type="button" data-close aria-label="닫기"></button>
      <div class="modal__frame" id="modal-frame"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
