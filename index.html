<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Portfolio</title>
  <meta name="description" content="영상 포트폴리오">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header" id="header">
    <div class="container header__inner">
      <a class="header__logo" href="#top">PORTFOLIO</a>
      <nav class="nav">
        <a class="nav__link" href="#about">About</a>
        <a class="nav__link" href="#works">Works</a>
      </nav>
    </div>
  </header>

  <main id="top">

    <!-- Hero -->
    <section class="container hero">
      <h1 class="hero__title">
        Frame by frame<span class="accent">,</span>
        <em>story by story<span class="accent">.</span></em>
      </h1>
    </section>

    <!-- About -->
    <section class="section" id="about">
      <div class="container">
        <span class="section__label">01 &mdash; About</span>
        <h2 class="section__title">Director</h2>
        <p class="section__body"><span class="accent">정희성(tiifosia)</span> &mdash; Directing &amp; Editing</p>
        <a class="about__link" href="https://instagram.com/tiifosia" target="_blank" rel="noopener">
          인스타그램 @tiifosia
        </a>
      </div>
    </section>

    <!-- Works -->
    <section class="section" id="works">
      <div class="container">
        <div class="works__head">
          <span class="section__label">02 &mdash; Works</span>
          <h2 class="section__title">Archive</h2>
        </div>

        <ul class="works__grid">
          <li class="work">
            <button class="work__trigger" type="button"
                    data-video-id="5j0lvHHFzhI"
                    aria-label="작품 제목 영상 재생">
              <figure class="work__thumb">
                <img src="https://img.youtube.com/vi/5j0lvHHFzhI/maxresdefault.jpg"
                     data-fallback="https://img.youtube.com/vi/5j0lvHHFzhI/hqdefault.jpg"
                     alt="" loading="lazy">
              </figure>
            </button>
            <h3 class="work__title">작품 제목</h3>
            <p class="work__meta">Work &middot; 2025</p>
          </li>
        </ul>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>&copy; 2026 Portfolio. All rights reserved.</span>
      <span>Seoul, Korea</span>
    </div>
  </footer>

  <div class="modal" id="modal">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-label="영상 재생">
      <button class="modal__close" type="button" data-close aria-label="닫기"></button>
      <div class="modal__frame" id="modal-frame"></div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
