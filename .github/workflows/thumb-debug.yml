# 일회용 진단 — DAY 9 썸네일. 확인 뒤 바로 지운다.
name: thumb-debug
on:
  push:
    branches: [v2_beta]
    paths: ['.github/workflows/thumb-debug.yml']
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: 썸네일 파일
        run: |
          for id in pYdEE6LrXWo epA7yq1SJAA J8cWZACnPJg sriBRLNUrbY MX1UcJnpUdg F3P8ZubTMjI A_o6vzQsLHk bIE3Y2mcyS0 WEeMDxygcQk; do
            for q in maxresdefault sddefault hqdefault; do
              code=$(curl -s -o t.jpg -w '%{http_code} %{size_download}B' "https://img.youtube.com/vi/$id/$q.jpg")
              dim=$(identify -format '%wx%h' t.jpg 2>/dev/null || echo '?')
              # 테두리(위·아래·양옆 10%)와 가운데의 평균 밝기 — 검은 띠·회색 기본 이미지 구분용
              stats=$(convert t.jpg -resize 100x100! \( +clone -crop 100x10+0+0 -format 'top=%[fx:mean*255]' info: \) \( +clone -crop 10x100+0+0 -format ' left=%[fx:mean*255]' info: \) -crop 60x60+20+20 -format ' mid=%[fx:mean*255]' info: 2>/dev/null || true)
              echo "$id $q $code $dim $stats"
            done
          done
      - name: 유튜브 API (해상도 · 제공 썸네일)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          cat > d.mjs <<'EOF'
          const t = await (await fetch('https://oauth2.googleapis.com/token', { method: 'POST', body: new URLSearchParams({
            client_id: process.env.YT_CLIENT_ID, client_secret: process.env.YT_CLIENT_SECRET,
            refresh_token: process.env.YT_REFRESH_TOKEN, grant_type: 'refresh_token' }) })).json();
          const ids = 'pYdEE6LrXWo,epA7yq1SJAA,J8cWZACnPJg,sriBRLNUrbY,MX1UcJnpUdg,F3P8ZubTMjI,A_o6vzQsLHk,bIE3Y2mcyS0,WEeMDxygcQk';
          const r = await (await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,fileDetails,player,contentDetails&maxWidth=1280&id=${ids}`,
            { headers: { Authorization: 'Bearer ' + t.access_token } })).json();
          if (r.error) { console.log(JSON.stringify(r.error)); process.exit(1); }
          for (const v of r.items) {
            const s = v.fileDetails?.videoStreams?.[0];
            console.log(v.id, v.snippet.title, '| 업로드', v.snippet.publishedAt,
              '| 영상', s ? `${s.widthPixels}x${s.heightPixels} (${s.aspectRatio})` : '?', '| 화질', v.contentDetails?.definition,
              '| 플레이어', `${v.player?.embedWidth}x${v.player?.embedHeight}`,
              '| 썸네일', Object.entries(v.snippet.thumbnails).map(([k, x]) => `${k}=${x.width}x${x.height}`).join(' '));
          }
          EOF
          node d.mjs
