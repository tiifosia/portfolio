# 유튜브 채널 AI영상팀(UCP9TZil5EtUoU3-BJULSpdg)에 새 영상(일부 공개 · 공개)이 올라오면 Works 에 'DAY N' 카드를 붙이고,
# 영상 설명이 있으면 Details 로 만들어(고치면 따라감) 공개 사이트(이 브랜치)에 바로 반영한다. 5분마다 확인하고,
# Actions 탭 → YouTube → Works → Run workflow 로 바로 돌릴 수도 있다.
# 필요한 저장소 비밀값: YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN
name: YouTube → Works

on:
  # 5분마다 — GitHub 이 허용하는 가장 짧은 간격(공개 저장소라 무료, 유튜브 API 는 하루 한도의 약 1/10).
  # GitHub 이 바쁠 때 예약 실행을 늦추거나 건너뛰기도 해서(10/3 저녁 한 시간 간격으로 세 번 연속 빠져
  # DAY 6 이 네 시간 가까이 늦었다) 자주 돌려 두어 한두 번 빠져도 곧 다음 실행이 받게 했다. 가장 붐비는 정각은 피한다.
  schedule:
    - cron: '2 * * * *'                                    # 매시 02분 — 실패하면 실패로 표시(알림 메일)
    - cron: '7,12,17,22,27,32,37,42,47,52,57 * * * *'      # 그 사이 — 실패해도 경고만(같은 문제로 5분마다 메일이 오지 않게)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write        # 멈춘 사이트 배포를 취소하려고
  deployments: read     # 사이트에 배포됐는지 보려고

concurrency:
  group: youtube-sync
  cancel-in-progress: false

env:
  SITE_BRANCH: claude/video-portfolio-webpage-63opzb
  BETA_BRANCH: v2_beta

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SITE_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 새 영상 · 설명 확인
        id: sync
        run: |
          node scripts/youtube-sync.mjs && exit 0
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$SCHEDULE" != '2 * * * *' ]; then
            echo "::warning::확인 실패 — 매시 02분 실행에서도 실패하면 실패로 알립니다"
            exit 0
          fi
          exit 1
        env:
          SCHEDULE: ${{ github.event.schedule }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      - name: 공개 사이트에 반영
        if: steps.sync.outputs.summary != ''
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Works: $SUMMARY (유튜브 자동)"
          # 사이트 배포는 이 푸시로 저절로 시작된다. 예전엔 여기서 한 번 더 요청해 배포가 둘씩 겹쳤고,
          # 10/6 DAY 9 때 남은 쪽이 'waiting' 으로 멈춰 사이트에 11시간 안 보였다 → 따로 요청하지 않는다
          git push origin "HEAD:$SITE_BRANCH"

      # 베타 브랜치도 새 카드를 받아 둔다(나중에 베타를 메인으로 올릴 때 어긋나지 않게).
      # 베타에서 같은 곳을 고치고 있어 합쳐지지 않으면 건드리지 않고 경고만 남긴다.
      - name: v2_beta 에도 반영
        if: steps.sync.outputs.summary != ''
        run: |
          MAIN=$(git rev-parse HEAD)
          git fetch origin "$BETA_BRANCH"
          git checkout -B "$BETA_BRANCH" "origin/$BETA_BRANCH"
          if git merge --no-edit "$MAIN"; then
            git push origin "$BETA_BRANCH"
          else
            git merge --abort
            echo "::warning::$BETA_BRANCH 에 자동으로 합치지 못했습니다 — 베타를 메인으로 올리기 전에 메인을 합쳐 주세요"
          fi

      # 공개 사이트에 실제로 배포됐는지 매번 확인하고, 멈춰 있으면 다시 띄운다.
      # 맨 위 커밋이 10분 넘게 배포되지 않았고 그새 진행 중인 배포도 없으면(GitHub 쪽에서 멈춤 · 실패)
      # 걸려 있는 배포를 취소하고 새로 요청한다. 5분마다 돌므로 멈춰도 30분 안쪽에 풀린다.
      - name: 공개 사이트 배포 확인
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="repos/$GITHUB_REPOSITORY"
          HEAD=$(gh api "$R/commits/$SITE_BRANCH" --jq .sha)
          for D in $(gh api "$R/deployments?sha=$HEAD&environment=github-pages" --jq '.[].id'); do
            if [ "$(gh api "$R/deployments/$D/statuses?per_page=1" --jq '.[0].state')" = success ]; then
              echo "사이트에 배포됨: ${HEAD:0:7}"; exit 0
            fi
          done
          AGE=$(( $(date +%s) - $(date -d "$(gh api "$R/commits/$HEAD" --jq .commit.committer.date)" +%s) ))
          if [ "$AGE" -lt 600 ]; then echo "배포 기다리는 중: ${HEAD:0:7} (커밋 ${AGE}초 전)"; exit 0; fi
          PAGES='.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")'
          if [ "$(gh api "$R/actions/runs?event=dynamic&per_page=30" --jq "[$PAGES | select(now - (.created_at | fromdateiso8601) < 600)] | length")" != 0 ]; then
            echo "배포 진행 중 — 다음 실행에서 다시 확인"; exit 0
          fi
          for ID in $(gh api "$R/actions/runs?event=dynamic&per_page=30" --jq "$PAGES | .id"); do
            gh api -X POST "$R/actions/runs/$ID/cancel" > /dev/null || gh api -X POST "$R/actions/runs/$ID/force-cancel" > /dev/null || true
          done
          echo "::warning::${HEAD:0:7} 이 $((AGE / 60))분째 사이트에 배포되지 않아 다시 배포를 요청합니다"
          gh api -X POST "$R/pages/builds" > /dev/null
